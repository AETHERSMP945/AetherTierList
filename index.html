<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherMC - Rankings</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; margin: 0; padding: 20px; }
    .header { text-align: center; cursor: pointer; margin-bottom: 10px; }
    h1 { color: #00ffcc; margin: 0; font-size: 42px; }
    .search { width: 350px; padding: 12px; margin: 15px auto; display: block; background: #1a1a2e; border: none; border-radius: 8px; color: white; font-size: 16px; }
    
    table { width: 100%; max-width: 1200px; margin: 20px auto; border-collapse: collapse; background: #111118; border-radius: 12px; overflow: hidden; }
    th, td { padding: 14px 16px; text-align: left; }
    th { background: #1f1f2b; }
    tr { cursor: move; }
    tr:hover { background: #1f1f2b; }

    .player-info { display: flex; align-items: center; gap: 12px; }
    .skin { width: 42px; height: 42px; border-radius: 6px; }
    .region { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .NA { background: #ff4444; } .EU { background: #4488ff; } .AS { background: #ffaa00; }
    .AU { background: #00cc88; } .SA { background: #bb44ff; }

    .gamemode { display: inline-flex; align-items: center; margin: 4px; background: #1a1a2e; padding: 5px 10px; border-radius: 8px; }
    .tier { font-size: 13px; margin-left: 6px; color: #ffcc00; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header" onclick="openAdmin()">
    <h1>✦ AetherMC ✦</h1>
    <p>Minecraft Competitive Rankings</p>
  </div>

  <a href="https://discord.gg/Q7PawrFqAu" target="_blank" style="display:block;text-align:center;color:#00ffcc;margin:10px;font-size:18px;">Join Discord</a>

  <input type="text" class="search" id="searchInput" placeholder="Search players..." onkeyup="searchPlayers()">

  <table id="rankingTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Region</th>
        <th>Gamemodes</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="rankingBody"></tbody>
  </table>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#111; padding:25px; border-radius:12px; width:90%; max-width:700px; z-index:100; max-height:90vh; overflow:auto;">
    <h2>🔑 Admin Panel</h2>
    <input type="password" id="adminPass" placeholder="Enter Password" style="width:100%; padding:12px; margin:10px 0; font-size:16px;">
    <button onclick="checkPassword()" style="padding:10px 20px;">Login</button>
    <button onclick="closeAdmin()">Cancel</button>

    <div id="adminContent" style="display:none; margin-top:20px;">
      <h3>Add / Edit Player</h3>
      <input type="text" id="playerName" placeholder="Player Name" style="width:100%; padding:10px; margin:5px 0;">
      <select id="playerRegion" style="padding:10px;">
        <option value="NA">NA</option>
        <option value="EU">EU</option>
        <option value="AS">AS</option>
        <option value="AU">AU</option>
        <option value="SA">SA</option>
      </select>
      <input type="number" id="playerPoints" placeholder="Points" value="100" style="padding:10px;">

      <h3>Gamemodes + Tier</h3>
      <div id="gamemodeSelect" style="max-height:300px; overflow-y:auto; background:#1a1a2e; padding:10px; border-radius:8px;"></div>

      <button onclick="addPlayerToDB()" style="margin:10px 5px; padding:12px 20px;">Save Player</button>
      <button onclick="deleteCurrentPlayer()" style="margin:10px 5px; padding:12px 20px; background:#ff4444; color:white;">Delete Player</button>
      <button onclick="closeAdmin()">Close</button>
    </div>
  </div>

  <script>
    let players = JSON.parse(localStorage.getItem('aetherPlayers')) || [];

    const gamemodesList = [
      {name: "Sword", icon: "https://mctiers.com/tier_icons/sword.svg"},
      {name: "Axe", icon: "https://mctiers.com/tier_icons/axe.svg"},
      {name: "Mace", icon: "https://mctiers.com/tier_icons/mace.svg"},
      {name: "NethOP", icon: "https://mctiers.com/tier_icons/nethop.svg"},
      {name: "Pot", icon: "https://mctiers.com/tier_icons/pot.svg"},
      {name: "SMP", icon: "https://mctiers.com/tier_icons/smp.svg"},
      {name: "UHC", icon: "https://mctiers.com/tier_icons/uhc.svg"},
      {name: "Vanilla", icon: "https://mctiers.com/tier_icons/vanilla.svg"}
    ];

    function renderTable() {
      const tbody = document.getElementById('rankingBody');
      tbody.innerHTML = '';

      players.forEach((p, i) => {
        let gmHTML = '';
        if (p.gamemodes && p.gamemodes.length > 0) {
          gmHTML = p.gamemodes.map(g => `
            <div class="gamemode">
              <img src="${g.icon}" width="26" height="26">
              ${g.tier ? `<span class="tier">${g.tier}</span>` : ''}
            </div>
          `).join('');
        }

        const row = document.createElement('tr');
        row.draggable = true;
        row.dataset.index = i;
        row.innerHTML = `
          <td>${i+1}</td>
          <td>
            <div class="player-info">
              <img src="https://mc-heads.net/head/${encodeURIComponent(p.name)}" class="skin" onerror="this.style.display='none'">
              <strong>${p.name}</strong>
            </div>
          </td>
          <td><span class="region ${p.region}">${p.region}</span></td>
          <td>${gmHTML}</td>
          <td><strong>${p.points}</strong></td>
        `;
        tbody.appendChild(row);
      });

      // Drag and Drop
      const rows = tbody.querySelectorAll('tr');
      rows.forEach(row => {
        row.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', row.dataset.index));
        row.addEventListener('dragover', e => e.preventDefault());
        row.addEventListener('drop', e => {
          e.preventDefault();
          const from = parseInt(e.dataTransfer.getData('text/plain'));
          const to = parseInt(row.dataset.index);
          if (from !== to) {
            const moved = players.splice(from, 1)[0];
            players.splice(to, 0, moved);
            localStorage.setItem('aetherPlayers', JSON.stringify(players));
            renderTable();
          }
        });
      });
    }

    function searchPlayers() {
      renderTable();
    }

    function openAdmin() {
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('adminPass').focus();
    }

    function checkPassword() {
      if (document.getElementById('adminPass').value === "admin123") {
        document.getElementById('adminContent').style.display = 'block';
        renderGamemodeOptions();
      } else {
        alert("❌ Wrong Password!");
      }
    }

    function renderGamemodeOptions() {
      const div = document.getElementById('gamemodeSelect');
      div.innerHTML = gamemodesList.map(g => `
        <div style="margin:8px 0; padding:8px; background:#222; border-radius:6px;">
          <input type="checkbox" id="gm_${g.name}" style="margin-right:8px;">
          <img src="${g.icon}" width="26" height="26" style="vertical-align:middle;">
          <label style="margin-left:8px;">${g.name}</label>
          <select id="tier_${g.name}" style="margin-left:15px; padding:5px;">
            <option value="">No Tier</option>
            ${["HT1","HT2","HT3","HT4","HT5","LT1","LT2","LT3","LT4","LT5"].map(t => `<option value="${t}">${t}</option>`).join('')}
          </select>
        </div>
      `).join('');
    }

    function addPlayerToDB() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert("Player name required!");

      const region = document.getElementById('playerRegion').value;
      const points = parseInt(document.getElementById('playerPoints').value) || 0;

      const gamemodes = [];
      gamemodesList.forEach(g => {
        if (document.getElementById(`gm_${g.name}`).checked) {
          const tier = document.getElementById(`tier_${g.name}`).value;
          gamemodes.push({name: g.name, icon: g.icon, tier: tier});
        }
      });

      const existing = players.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      if (existing !== -1) players[existing] = { name, region, points, gamemodes };
      else players.push({ name, region, points, gamemodes });

      localStorage.setItem('aetherPlayers', JSON.stringify(players));
      renderTable();
      alert(`✅ ${name} saved!`);
    }

    function deleteCurrentPlayer() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert("Enter player name");
      if (confirm(`Delete ${name} permanently?`)) {
        players = players.filter(p => p.name.toLowerCase() !== name.toLowerCase());
        localStorage.setItem('aetherPlayers', JSON.stringify(players));
        renderTable();
        alert(`${name} deleted.`);
      }
    }

    function closeAdmin() {
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('adminPass').value = '';
    }

    renderTable();
  </script>
</body>
</html>
