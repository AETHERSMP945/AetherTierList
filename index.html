<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherMC - Minecraft Tier List</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f23;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #00ffcc;
      margin-bottom: 10px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .tier {
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
    }
    .tier-header {
      padding: 12px 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .S { background: #ff2d55; }
    .A { background: #ff8c00; }
    .B { background: #ffd700; color: black; }
    .C { background: #00cc66; }
    .D { background: #6666ff; }
    .F { background: #888; }

    .items {
      padding: 15px;
      background: #1a1a2e;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 80px;
    }
    .item {
      background: #16213e;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: move;
      user-select: none;
    }
    .add-form {
      text-align: center;
      margin: 20px 0;
    }
    input, select, button {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    .clear-btn {
      background: #ff2d55;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✦ AetherMC Tier List ✦</h1>
    <p style="text-align:center;">Minecraft Ranking System</p>

    <div class="add-form">
      <input type="text" id="itemName" placeholder="Item / Mob / Thing" />
      <select id="tierSelect">
        <option value="S">S Tier</option>
        <option value="A">A Tier</option>
        <option value="B" selected>B Tier</option>
        <option value="C">C Tier</option>
        <option value="D">D Tier</option>
        <option value="F">F Tier</option>
      </select>
      <button onclick="addItem()">Add</button>
      <button onclick="saveData()" style="background:#00ccff;">Save</button>
      <button onclick="clearAll()" class="clear-btn">Clear All</button>
    </div>

    <div id="tiers"></div>
  </div>

  <script>
    const tiersData = {
      "S": [], "A": [], "B": [], "C": [], "D": [], "F": []
    };

    function render() {
      const container = document.getElementById('tiers');
      container.innerHTML = '';

      const order = ["S", "A", "B", "C", "D", "F"];
      const colors = {S:"S", A:"A", B:"B", C:"C", D:"D", F:"F"};

      order.forEach(tier => {
        const div = document.createElement('div');
        div.className = `tier ${tier}`;
        div.innerHTML = `
          <div class="tier-header">${tier} Tier (${tiersData[tier].length})</div>
          <div class="items" ondrop="drop(event)" ondragover="allowDrop(event)" data-tier="${tier}">
            ${tiersData[tier].map(item => `
              <div class="item" draggable="true" ondragstart="drag(event)" data-item="${item}">
                ${item}
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addItem() {
      const name = document.getElementById('itemName').value.trim();
      const tier = document.getElementById('tierSelect').value;
      
      if (!name) return alert("Please enter an item name");
      
      if (!tiersData[tier].includes(name)) {
        tiersData[tier].push(name);
        document.getElementById('itemName').value = '';
        render();
      }
    }

    function allowDrop(ev) {
      ev.preventDefault();
    }

    function drag(ev) {
      ev.dataTransfer.setData("text", ev.target.getAttribute("data-item"));
      ev.dataTransfer.setData("fromTier", ev.target.parentElement.getAttribute("data-tier"));
    }

    function drop(ev) {
      ev.preventDefault();
      const itemName = ev.dataTransfer.getData("text");
      const fromTier = ev.dataTransfer.getData("fromTier");
      const toTier = ev.target.getAttribute("data-tier") || ev.target.closest('.items').getAttribute("data-tier");

      if (fromTier === toTier) return;

      // Remove from old tier
      tiersData[fromTier] = tiersData[fromTier].filter(item => item !== itemName);
      // Add to new tier
      if (!tiersData[toTier].includes(itemName)) {
        tiersData[toTier].push(itemName);
      }
      render();
    }

    function saveData() {
      localStorage.setItem('aethermc_tierlist', JSON.stringify(tiersData));
      alert("✅ Saved! (in your browser)");
    }

    function clearAll() {
      if (confirm("Delete everything?")) {
        Object.keys(tiersData).forEach(key => tiersData[key] = []);
        render();
      }
    }

    // Load saved data
    const saved = localStorage.getItem('aethermc_tierlist');
    if (saved) {
      Object.assign(tiersData, JSON.parse(saved));
    }

    render();
  </script>
</body>
</html>
