<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherMC - Rankings</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; margin: 0; padding: 20px; }
    .header { text-align: center; cursor: pointer; margin-bottom: 10px; }
    h1 { color: #00ffcc; margin: 0; font-size: 42px; }
    .search { width: 350px; padding: 12px; margin: 15px auto; display: block; background: #1a1a2e; border: none; border-radius: 8px; color: white; font-size: 16px; }
    
    table { width: 100%; max-width: 1200px; margin: 20px auto; border-collapse: collapse; background: #111118; border-radius: 12px; overflow: hidden; }
    th, td { padding: 14px 16px; text-align: left; }
    th { background: #1f1f2b; }
    tr:hover { background: #1f1f2b; }

    .player-info { display: flex; align-items: center; gap: 12px; }
    .skin { width: 42px; height: 42px; border-radius: 6px; background: #222; }
    .region { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .NA { background: #ff4444; } .EU { background: #4488ff; } .AS { background: #ffaa00; }
    .AU { background: #00cc88; } .SA { background: #bb44ff; }

    .gamemode { display: inline-flex; align-items: center; margin-right: 8px; background: #1a1a2e; padding: 4px 8px; border-radius: 6px; }
    .tier { font-size: 12px; margin-left: 4px; color: #ffd700; }
  </style>
</head>
<body>

  <div class="header" onclick="openAdmin()">
    <h1>✦ AetherMC ✦</h1>
    <p>Minecraft Competitive Rankings</p>
  </div>

  <a href="https://discord.gg/Q7PawrFqAu" target="_blank" style="display:block;text-align:center;color:#00ffcc;margin:10px;">Join Discord</a>

  <input type="text" class="search" id="searchInput" placeholder="Search players..." onkeyup="searchPlayers()">

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Region</th>
        <th>Gamemodes</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="rankingBody"></tbody>
  </table>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#111; padding:25px; border-radius:12px; width:90%; max-width:650px; z-index:100;">
    <h2>Admin Panel</h2>
    <input type="password" id="adminPass" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;">
    <button onclick="checkPassword()">Login</button>
    <button onclick="closeAdmin()">Cancel</button>

    <div id="adminContent" style="display:none; margin-top:15px;">
      <input type="text" id="playerName" placeholder="Player Name" style="width:100%; padding:8px; margin:5px 0;">
      <select id="playerRegion" style="padding:8px;">
        <option value="NA">NA</option>
        <option value="EU">EU</option>
        <option value="AS">AS</option>
        <option value="AU">AU</option>
        <option value="SA">SA</option>
      </select>
      <input type="number" id="playerPoints" placeholder="Points" value="100" style="padding:8px;">

      <h3>Gamemodes + Tier</h3>
      <div id="gamemodeSelect"></div>

      <button onclick="addPlayerToDB()" style="margin-top:10px;">Add / Update Player</button>
      <button onclick="closeAdmin()">Close</button>
    </div>
  </div>

  <script>
    let players = JSON.parse(localStorage.getItem('aetherPlayers')) || [];

    const gamemodesList = [
      {name: "Sword", icon: "https://mctiers.com/tier_icons/sword.svg"},
      {name: "Axe", icon: "https://mctiers.com/tier_icons/axe.svg"},
      {name: "Mace", icon: "https://mctiers.com/tier_icons/mace.svg"},
      {name: "NethOP", icon: "https://mctiers.com/tier_icons/nethop.svg"},
      {name: "Pot", icon: "https://mctiers.com/tier_icons/pot.svg"},
      {name: "SMP", icon: "https://mctiers.com/tier_icons/smp.svg"},
      {name: "UHC", icon: "https://mctiers.com/tier_icons/uhc.svg"},
      {name: "Vanilla", icon: "https://mctiers.com/tier_icons/vanilla.svg"}
    ];

    function renderTable(filtered = players) {
      const tbody = document.getElementById('rankingBody');
      tbody.innerHTML = '';

      filtered.sort((a, b) => b.points - a.points);

      filtered.forEach((p, i) => {
        const row = document.createElement('tr');
        let gmHTML = '';
        
        if (p.gamemodes) {
          gmHTML = p.gamemodes.map(g => `
            <div class="gamemode">
              <img src="${g.icon}" width="24" height="24">
              <span class="tier">${g.tier || ''}</span>
            </div>
          `).join('');
        }

        row.innerHTML = `
          <td>${i+1}</td>
          <td>
            <div class="player-info">
              <img src="https://mc-heads.net/head/${p.name}" class="skin" onerror="this.src='https://via.placeholder.com/42'">
              <strong>${p.name}</strong>
            </div>
          </td>
          <td><span class="region ${p.region}">${p.region}</span></td>
          <td>${gmHTML}</td>
          <td><strong>${p.points}</strong></td>
        `;
        tbody.appendChild(row);
      });
    }

    function searchPlayers() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = players.filter(p => p.name.toLowerCase().includes(term));
      renderTable(filtered);
    }

    function openAdmin() {
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('adminPass').focus();
    }

    function checkPassword() {
      if (document.getElementById('adminPass').value === "aetherisbest") {
        document.getElementById('adminContent').style.display = 'block';
        renderGamemodeOptions();
      } else {
        alert("Wrong Password!");
      }
    }

    function renderGamemodeOptions() {
      const div = document.getElementById('gamemodeSelect');
      div.innerHTML = gamemodesList.map(g => `
        <div style="margin:8px 0;">
          <input type="checkbox" id="gm_${g.name}" value='${JSON.stringify(g)}'>
          <label for="gm_${g.name}">
            <img src="${g.icon}" width="24" height="24"> ${g.name}
          </label>
          <select id="tier_${g.name}">
            <option value="">No Tier</option>
            <option value="HT1">HT1</option><option value="HT2">HT2</option><option value="HT3">HT3</option><option value="HT4">HT4</option><option value="HT5">HT5</option>
            <option value="LT1">LT1</option><option value="LT2">LT2</option><option value="LT3">LT3</option><option value="LT4">LT4</option><option value="LT5">LT5</option>
          </select>
        </div>
      `).join('');
    }

    function addPlayerToDB() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert("Player name required!");

      const region = document.getElementById('playerRegion').value;
      const points = parseInt(document.getElementById('playerPoints').value) || 0;

      const gamemodes = [];
      gamemodesList.forEach(g => {
        const checkbox = document.getElementById(`gm_${g.name}`);
        if (checkbox && checkbox.checked) {
          const tier = document.getElementById(`tier_${g.name}`).value;
          gamemodes.push({ ...g, tier: tier });
        }
      });

      // Update if exists, else add new
      const existing = players.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      if (existing !== -1) {
        players[existing] = { name, region, points, gamemodes };
      } else {
        players.push({ name, region, points, gamemodes });
      }

      localStorage.setItem('aetherPlayers', JSON.stringify(players));
      renderTable();
      alert("Player saved!");
    }

    function closeAdmin() {
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('adminPass').value = '';
    }

    renderTable();
  </script>
</body>
</html>
