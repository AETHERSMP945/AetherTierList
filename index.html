<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AETHER – Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0e14;
    --surface: #13151f;
    --surface2: #1a1d2b;
    --border: rgba(255,255,255,0.07);
    --accent: #6c8fff;
    --accent2: #a78bfa;
    --gold: #f5c542;
    --silver: #c0c7d4;
    --bronze: #cd7f4a;
    --text: #e8eaf0;
    --muted: #6b7280;
    --green: #4ade80;
    --red: #f87171;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG grid lines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(108,143,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,143,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,14,20,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem;
    height: 64px;
  }

  .nav-logo {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    background: linear-gradient(135deg, #6c8fff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    cursor: pointer;
    user-select: none;
  }

  .nav-links {
    display: flex; align-items: center; gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    transition: color 0.2s;
    display: flex; align-items: center; gap: 6px;
  }

  .nav-links a:hover, .nav-links a.active { color: var(--text); }
  .nav-links a.active { color: var(--accent); }

  .discord-link {
    display: flex; align-items: center; gap: 8px;
    background: #5865F2;
    color: #fff !important;
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 0.8rem !important;
    font-weight: 600 !important;
    transition: opacity 0.2s !important;
  }
  .discord-link:hover { opacity: 0.85; color: #fff !important; }

  /* HERO */
  .hero {
    position: relative; z-index: 1;
    text-align: center;
    padding: 3rem 1rem 2rem;
  }

  .hero h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #fff 30%, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }

  /* CATEGORY TABS */
  .categories {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 6px;
    padding: 1rem 2rem 0;
    max-width: 900px;
    margin: 0 auto;
  }

  .cat-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    min-width: 72px;
  }
  .cat-btn:hover { border-color: rgba(108,143,255,0.35); color: var(--text); }
  .cat-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(108,143,255,0.08);
  }
  .cat-icon { font-size: 1.2rem; width: 22px; height: 22px; object-fit: contain; }

  /* MAIN CONTENT */
  main {
    position: relative; z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 4rem;
  }

  /* TABLE HEADER */
  .table-header {
    display: grid;
    grid-template-columns: 60px 1fr 90px 130px 90px;
    padding: 0.6rem 1rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.5rem;
  }

  /* PLAYER ROW */
  .player-row {
    display: grid;
    grid-template-columns: 60px 1fr 90px 130px 90px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeIn 0.4s ease both;
  }

  .player-row:hover {
    border-color: rgba(108,143,255,0.3);
    background: var(--surface2);
    transform: translateX(3px);
  }

  .player-row:nth-child(1) { animation-delay: 0.05s; }
  .player-row:nth-child(2) { animation-delay: 0.1s; }
  .player-row:nth-child(3) { animation-delay: 0.15s; }
  .player-row:nth-child(4) { animation-delay: 0.2s; }
  .player-row:nth-child(5) { animation-delay: 0.25s; }
  .player-row:nth-child(6) { animation-delay: 0.3s; }
  .player-row:nth-child(7) { animation-delay: 0.35s; }
  .player-row:nth-child(8) { animation-delay: 0.4s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Rank */
  .rank-cell {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .rank-1 { color: var(--gold); }
  .rank-2 { color: var(--silver); }
  .rank-3 { color: var(--bronze); }

  .rank-medal { font-size: 1rem; }

  /* Player info */
  .player-info {
    display: flex; align-items: center; gap: 12px;
  }

  .avatar {
    width: 42px; height: 42px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .player-name-wrap {}
  .player-name {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
  }

  .player-title {
    font-size: 0.72rem;
    color: var(--muted);
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px;
  }

  .title-icon { font-size: 0.8rem; }

  /* Region badge */
  .region-badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .region-NA { background: rgba(108,143,255,0.15); color: #6c8fff; border: 1px solid rgba(108,143,255,0.3); }
  .region-EU { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.25); }
  .region-AS { background: rgba(251,146,60,0.1); color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
  .region-SA { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.25); }

  /* Tiers display */
  .tiers-cell {
    display: flex; flex-wrap: wrap; gap: 4px;
  }

  .tier-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border-radius: 6px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    border: 1px solid;
    flex-direction: column;
    gap: 1px;
  }
  .tier-badge .tb-icon { font-size: 0.8rem; }
  .tier-badge .tb-label { font-size: 0.5rem; letter-spacing: 0.05em; }

  .tier-HT1 { background: rgba(245,197,66,0.15);  color: #f5c542; border-color: rgba(245,197,66,0.4); }
  .tier-HT2 { background: rgba(251,146,60,0.13);  color: #fb923c; border-color: rgba(251,146,60,0.35); }
  .tier-HT3 { background: rgba(248,113,113,0.12); color: #f87171; border-color: rgba(248,113,113,0.3); }
  .tier-HT4 { background: rgba(167,139,250,0.13); color: #a78bfa; border-color: rgba(167,139,250,0.35); }
  .tier-HT5 { background: rgba(96,165,250,0.12);  color: #60a5fa; border-color: rgba(96,165,250,0.3); }
  .tier-LT1 { background: rgba(34,211,238,0.11);  color: #22d3ee; border-color: rgba(34,211,238,0.28); }
  .tier-LT2 { background: rgba(74,222,128,0.1);   color: #4ade80; border-color: rgba(74,222,128,0.25); }
  .tier-LT3 { background: rgba(108,143,255,0.11); color: #6c8fff; border-color: rgba(108,143,255,0.28); }
  .tier-LT4 { background: rgba(148,163,184,0.1);  color: #94a3b8; border-color: rgba(148,163,184,0.25); }
  .tier-LT5 { background: rgba(100,116,139,0.08); color: #64748b; border-color: rgba(100,116,139,0.2); }

  /* Points */
  .points-cell {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
    text-align: right;
  }

  /* TOP 3 special */
  .player-row.top1 { border-color: rgba(245,197,66,0.35); background: rgba(245,197,66,0.04); }
  .player-row.top2 { border-color: rgba(192,199,212,0.3); background: rgba(192,199,212,0.03); }
  .player-row.top3 { border-color: rgba(205,127,74,0.3); background: rgba(205,127,74,0.03); }

  /* ADMIN MODAL */
  .modal-overlay {
    position: fixed; inset: 0; z-index
